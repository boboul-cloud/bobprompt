name: Prompteur
options:
  bundleIdPrefix: com.bobprompt
  xcodeVersion: "27.0"
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: fr
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    DEAD_CODE_STRIPPING: "YES"
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "YES"
    DEVELOPMENT_TEAM: 38DQ8FW23J
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "8"

targets:
  Prompteur:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Prompteur
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bobprompt.app
        PRODUCT_NAME: Prompteur
        INFOPLIST_FILE: Prompteur/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: bobprompt
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Prompteur/Prompteur.entitlements
        # Apple Intelligence (iOS 26+) : liaison faible pour rester compatible iOS 17
        OTHER_LDFLAGS: "$(inherited) -weak_framework FoundationModels"
  PrompteurTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PrompteurTests
    dependencies:
      - target: Prompteur
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bobprompt.app.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Prompteur.app/Prompteur"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Prompteur:
    build:
      targets:
        Prompteur: all
        PrompteurTests: [test]
    run:
      config: Debug
      storeKitConfiguration: Prompteur/Products.storekit
    test:
      config: Debug
      targets:
        - PrompteurTests
    archive:
      config: Release
